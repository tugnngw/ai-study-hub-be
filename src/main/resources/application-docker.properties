# Database - Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/ai_study_hub
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
logging.level.org.springframework.jdbc=${JDBC_LOG_LEVEL:WARN}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6380

server.port=4040

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
# App
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=sub

app.mail.from-email=${MAIL_FROM_EMAIL:aistudyhub.noreply@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:AI Study Hub}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

gemini.api.key=${GEMINI_API_KEY}
gemini.model.embedding=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
gemini.model.chat=${GEMINI_CHAT_MODEL:gemini-2.5-flash}