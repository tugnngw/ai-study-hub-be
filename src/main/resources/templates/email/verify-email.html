<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{email/base}">
<head>
    <title>Verify your email</title>
</head>
<body>
<div layout:fragment="content">
    <div style="text-align: center; margin-bottom: 24px;">
        <div style="display: inline-block; width: 56px; height: 56px; border-radius: 50%;
                    background: linear-gradient(135deg, #818cf8, #6366f1);
                    line-height: 56px; font-size: 24px; color: #fff; margin-bottom: 16px;">
            &#x2709;
        </div>
        <h2 style="margin: 0 0 8px; font-size: 22px; font-weight: 700; color: #1e1b4b;">
            Verify your email
        </h2>
        <p style="margin: 0; font-size: 15px; color: #6b7280; line-height: 1.5;">
            Thank you for signing up, <strong th:text="${name}">you</strong>!
            <br/>
            Please click the button below to complete verification.
        </p>
    </div>

    <div style="text-align: center; margin: 28px 0;">
        <a th:href="${buttonUrl}"
           style="display: inline-block; padding: 16px 48px;
                  background: linear-gradient(135deg, #6366f1, #4f46e5);
                  color: #ffffff !important; text-decoration: none;
                  border-radius: 8px; font-size: 16px; font-weight: 600;
                  letter-spacing: 0.3px;
                  box-shadow: 0 4px 14px rgba(99,102,241,0.35);">
            &#10003; Verify Email
        </a>
    </div>

    <div style="background: #fef3c7; border-radius: 8px; padding: 12px 16px;
                border: 1px solid #fde68a; margin-bottom: 16px;">
        <p style="margin: 0; font-size: 13px; color: #92400e;">
            &#9888; This link expires in <strong th:text="${expirationHours}">24</strong> hours.
        </p>
    </div>

    <p style="font-size: 13px; color: #9ca3af; text-align: center; margin: 0;">
        If you did not create this account, please ignore this email.
    </p>
</div>
</body>
</html>
