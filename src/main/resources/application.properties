spring.application.name=ai-study-hub-be

spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5434/ai_study_hub
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Server Config
server.port=4040

# Redis Config (Local)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# App
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# Mail Config
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ========================================
# OAuth2 Security (Google)
# ========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

cloudinary.cloud-name=dpx7mzzv1
cloudinary.api-key=899758863657928
cloudinary.api-secret=jdO40n0vqzqE3vhRPEcadx67QaQ

gemini.api.key=${GEMINI_API_KEY}
gemini.model.embedding=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
gemini.model.chat=${GEMINI_CHAT_MODEL:gemini-2.0-flash}

# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/payment/success}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}

logging.file.name=logs/spring-boot-application.log
logging.level.root=INFO
logging.level.com.tugnw.aistudy=DEBUG
